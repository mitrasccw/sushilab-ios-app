workflows:
  ios_simulator_preview:
    name: Cordova iOS Simulator Preview
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      cocoapods: default
      node: 20.11.1
      vars:
        CORDOVA_PROJECT_DIR: "."

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
        - $CORDOVA_PROJECT_DIR/node_modules

    scripts:
      - name: Install npm dependencies
        script: |
          cd "$CORDOVA_PROJECT_DIR"
          npm ci || npm install

      - name: Recreate iOS platform cleanly
        script: |
          cd "$CORDOVA_PROJECT_DIR"
          cordova platform rm ios || true
          cordova platform add ios
          cordova plugin add cordova-plugin-inappbrowser || true
          cordova prepare ios

      - name: Verify generated Xcode project
        script: |
          cd "$CORDOVA_PROJECT_DIR"
          ls platforms/ios
          ls platforms/ios/App.xcworkspace
          ls platforms/ios/App.xcodeproj

      - name: Build simulator app with xcodebuild
        script: |
          cd "$CORDOVA_PROJECT_DIR"
          xcodebuild build \
            -workspace "platforms/ios/App.xcworkspace" \
            -scheme "App" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - $CORDOVA_PROJECT_DIR/build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
      - $CORDOVA_PROJECT_DIR/build/DerivedData/Build/Products/Debug-iphonesimulator/*.dSYM

  ios_release:
    name: Cordova iOS Release (IPA)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      node: 20.11.1
      vars:
        CORDOVA_PROJECT_DIR: "."
      # Uncomment and configure after setting up your signing certs in CodeMagic UI:
      # ios_signing:
      #   distribution_type: app_store
      #   bundle_identifier: com.sushilab.app
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
        - $CORDOVA_PROJECT_DIR/node_modules
    scripts:
      - name: Install npm dependencies
        script: |
          cd "$CORDOVA_PROJECT_DIR"
          npm ci || npm install
      - name: Recreate iOS platform cleanly
        script: |
          cd "$CORDOVA_PROJECT_DIR"
          cordova platform rm ios || true
          cordova platform add ios
          cordova plugin add cordova-plugin-inappbrowser || true
          cordova prepare ios
      - name: Build release IPA
        script: |
          cd "$CORDOVA_PROJECT_DIR"
          # Build for device; requires signing to be configured.
          # If using CodeMagic automatic signing, add the ios_signing block above.
          # If using manual signing, create a build.json with your team/identity.
          cordova build ios --release --device --buildConfig=build.json
    artifacts:
      - $CORDOVA_PROJECT_DIR/platforms/ios/build/device/*.ipa
      - $CORDOVA_PROJECT_DIR/platforms/ios/build/device/*.dSYM
