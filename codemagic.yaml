workflows:
  ios_simulator_preview:
    name: Cordova iOS Simulator Preview
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      cocoapods: default
      node: 20.11.1
      vars:
        CORDOVA_PROJECT_DIR: "."
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sushilab.app
      integrations:
        app_store_connect: codemagic

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
        - $CORDOVA_PROJECT_DIR/node_modules

    scripts:
      - name: Install npm dependencies
        script: |
          cd "$CORDOVA_PROJECT_DIR"
          npm ci || npm install

      - name: Recreate iOS platform cleanly
        script: |
          cd "$CORDOVA_PROJECT_DIR"
          cordova platform rm ios || true
          cordova platform add ios
          cordova plugin add cordova-plugin-inappbrowser || true
          cordova prepare ios

      - name: Verify generated Xcode project
        script: |
          cd "$CORDOVA_PROJECT_DIR"
          ls platforms/ios
          ls platforms/ios/App.xcworkspace
          ls platforms/ios/App.xcodeproj

      - name: Set up code signing
        script: |
          cd "$CORDOVA_PROJECT_DIR"
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          cd "$CORDOVA_PROJECT_DIR"
          xcode-project build-ipa \
            --workspace "platforms/ios/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/Archives/**/*.xcarchive

  ios_app_store_ipa:
    name: Cordova iOS App Store IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic

    environment:
      xcode: latest
      cocoapods: default
      node: 20.11.1
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sushilab.app
      vars:
        CORDOVA_PROJECT_DIR: "."
        XCODE_WORKSPACE: "platforms/ios/App.xcworkspace"
        XCODE_SCHEME: "App"

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
        - $CORDOVA_PROJECT_DIR/node_modules

    scripts:
      - name: Install npm dependencies
        script: |
          cd "$CORDOVA_PROJECT_DIR"
          npm ci || npm install

      - name: Recreate iOS platform cleanly
        script: |
          cd "$CORDOVA_PROJECT_DIR"
          cordova platform rm ios || true
          cordova platform add ios
          cordova plugin add cordova-plugin-inappbrowser || true
          cordova prepare ios

      - name: Set up code signing
        script: |
          cd "$CORDOVA_PROJECT_DIR"
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          cd "$CORDOVA_PROJECT_DIR"
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/Archives/**/*.xcarchive

  ios_release:
    name: Cordova iOS Release (IPA)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      node: 20.11.1
      vars:
        CORDOVA_PROJECT_DIR: "."
      # Uncomment and configure after setting up your signing certs in CodeMagic UI:
      # ios_signing:
      #   distribution_type: app_store
      #   bundle_identifier: com.sushilab.app
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
        - $CORDOVA_PROJECT_DIR/node_modules
    scripts:
      - name: Install npm dependencies
        script: |
          cd "$CORDOVA_PROJECT_DIR"
          npm ci || npm install
      - name: Recreate iOS platform cleanly
        script: |
          cd "$CORDOVA_PROJECT_DIR"
          cordova platform rm ios || true
          cordova platform add ios
          cordova plugin add cordova-plugin-inappbrowser || true
          cordova prepare ios
      - name: Build release IPA
        script: |
          cd "$CORDOVA_PROJECT_DIR"
          # Build for device; requires signing to be configured.
          # If using CodeMagic automatic signing, add the ios_signing block above.
          # If using manual signing, create a build.json with your team/identity.
          cordova build ios --release --device --buildConfig=build.json
    artifacts:
      - $CORDOVA_PROJECT_DIR/platforms/ios/build/device/*.ipa
      - $CORDOVA_PROJECT_DIR/platforms/ios/build/device/*.dSYM
